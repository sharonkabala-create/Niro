<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Niro</title>
<meta name="theme-color" content="#0E2A30">
<meta name="description" content="Niro · talk to whoever is here.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Niro">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Karantina:wght@700&family=IBM+Plex+Sans+Hebrew:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=Sora:wght@700&display=swap">
<style>
:root{
  --bg:#EAF0EF; --surface:#F7FAF9; --line:#CFDCDA; --ink:#0E2A30; --muted:#587074;
  --signal:#F2553C; --signal-soft:#FDE2DC; --on-signal:#FFFFFF;
  --me:#0E2A30; --on-me:#F7FAF9; --ok:#1F8A6B; --lock:#8DA0A2;
  --ring:#2FA88F; --ring-soft:#DCF1EB; --mark:#0E2A30; --on-mark:#F7FAF9;
  --f-brand:"Sora",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Hebrew","IBM Plex Sans","IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-display:"Karantina","IBM Plex Sans Hebrew",system-ui,sans-serif;
  --display-scale:1; --display-lh:.9;
  color-scheme:light;
}
html[lang="en"],html[lang="ru"]{--f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--f-display:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;--display-scale:.74;--display-lh:1.02}
html[lang="ar"]{--f-body:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;--f-display:"IBM Plex Sans Arabic",system-ui,sans-serif;--display-scale:.66;--display-lh:1.25}
@media (prefers-color-scheme: dark){:root{
  --bg:#0A181C; --surface:#10232A; --line:#20393F; --ink:#E3EFEE; --muted:#8AA4A6;
  --signal:#FF6A50; --signal-soft:#3A1F1A; --on-signal:#1A0905;
  --me:#E3EFEE; --on-me:#0A181C; --ok:#4CC9A0; --lock:#557073;
  --ring:#4FD1B5; --ring-soft:#12352F; --mark:#19464F; --on-mark:#E3EFEE; color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
[hidden]{display:none!important}
.app{max-width:480px;height:100%;margin:0 auto;display:flex;flex-direction:column;background:var(--surface);padding-top:env(safe-area-inset-top,0px)}
@media (min-width:520px){.app{border-inline:1px solid var(--line)}}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* splash */
#splash{position:fixed;inset:0;z-index:50;background:var(--mark);display:grid;place-items:center;transition:opacity .45s ease,visibility .45s}
#splash.hide{opacity:0;visibility:hidden}
#splash .inner{display:grid;justify-items:center;gap:22px}
#splash svg{width:132px;height:132px;overflow:visible}
#splash .sp-ring{transform-origin:66px 66px;animation:sp 2.2s cubic-bezier(.2,.6,.3,1) infinite;opacity:0}
#splash .sp-ring.r2{animation-delay:.7s}#splash .sp-ring.r3{animation-delay:1.4s}
@keyframes sp{0%{transform:scale(.3);opacity:.9}100%{transform:scale(1.6);opacity:0}}
#splash .sp-dot{transform-origin:66px 66px;animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
#splash .sp-sat{animation:pop .5s .35s cubic-bezier(.3,1.6,.5,1) both;transform-box:fill-box;transform-origin:center}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
#splash .word{color:var(--on-mark);font-size:40px;animation:rise .6s .25s ease-out both}
#splash .word .o{border-color:var(--on-mark)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#splash *{animation:none!important;opacity:1}#splash .sp-ring{opacity:.25}}

/* brand */
.brand{display:flex;align-items:center;gap:9px;direction:ltr;flex:none}
.brand .mark{width:36px;height:36px;display:block}
.ripple{transform-origin:20px 20px;animation:ripple 3.2s ease-out infinite}
@keyframes ripple{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.25);opacity:0}}
.word{font-family:var(--f-brand);font-weight:700;font-size:26px;letter-spacing:-.04em;line-height:1;color:var(--ink);display:flex;align-items:baseline;direction:ltr}
.word .o{display:inline-grid;place-items:center;width:.6em;height:.6em;border:.13em solid var(--ink);border-radius:50%;margin-left:.03em}
.word .o::after{content:"";width:.17em;height:.17em;border-radius:50%;background:var(--signal)}

/* header & nav */
header.top{padding-block:10px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.place{text-align:end;min-width:0;flex:1}
.place b{display:block;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.place small{color:var(--muted);font-size:12px;display:flex;gap:6px;align-items:center;justify-content:flex-end}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block;flex:none}
.dot.off{background:var(--lock)} .dot.warn{background:var(--signal)}
.mebtn{border:0;background:none;padding:0;border-radius:50%;flex:none}
.mebtn .av{width:38px;height:38px;box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--signal)}
nav.tabs{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line)}
nav.tabs button{background:none;border:0;padding:11px 2px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;display:flex;gap:5px;justify-content:center;align-items:center;font-size:14px;min-width:0}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--signal)}
.badge{background:var(--signal);color:var(--on-signal);font-size:11px;font-weight:600;min-width:18px;height:18px;border-radius:9px;display:inline-grid;place-items:center;padding:0 5px;font-variant-numeric:tabular-nums}
main{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column}
.pane{display:flex;flex-direction:column;flex:1;min-height:0}
.notice{margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--signal-soft);font-size:13px}

/* avatars */
.av{width:40px;height:40px;border-radius:50%;object-fit:cover;display:block;flex:none;background:var(--bg)}
.stack{display:flex;align-items:center}
.stack .av{width:24px;height:24px;box-shadow:0 0 0 2px var(--surface)}
.stack .av+.av{margin-inline-start:-7px}

/* radar */
.radarbox{padding-block:18px 4px;display:grid;justify-items:center;gap:14px}
.radar{width:100%;max-width:320px;aspect-ratio:1;overflow:visible}
.radar text{font-family:var(--f-body)}
.radar .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 3.6s cubic-bezier(.2,.6,.3,1) infinite}
@keyframes pulse{0%{transform:scale(.12);opacity:.55}100%{transform:scale(1);opacity:0}}
.radar .who{cursor:pointer;filter:drop-shadow(0 2px 4px rgba(14,42,48,.22))}
.radar .who:focus,.radar .who:focus-visible{outline:none}
.radar .who:focus-visible circle.halo{stroke:var(--signal);stroke-width:2.5}
@media (prefers-reduced-motion:reduce){.radar .pulse,.ripple{animation:none;opacity:0}}
.rangebar{width:100%;max-width:320px;display:grid;gap:8px}
.rangebar .lbl{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--muted)}
.rangebar .lbl b{color:var(--ink);font-weight:600;font-size:14px}
.radar-note{font-size:12px;color:var(--muted);text-align:center;margin:0}
.seg{display:inline-flex;flex-wrap:wrap;gap:2px;background:var(--bg);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:6px 12px;font-size:13px;border-radius:999px;color:var(--muted);min-height:32px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(14,42,48,.14)}
.rangebar .seg,.seg.grid4{display:grid;grid-template-columns:repeat(4,1fr)}
.seg.grid2{display:grid;grid-template-columns:repeat(2,1fr)}
.bars{display:inline-flex;align-items:flex-end;gap:2px;height:11px}
.bars i{width:3px;border-radius:1px;background:var(--line);display:block}
.bars i:nth-child(1){height:4px}.bars i:nth-child(2){height:7px}.bars i:nth-child(3){height:11px}
.bars i.on{background:var(--ring)}

/* lists */
.section-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding-block:16px 6px}
.section-h h2{margin:0;font-family:var(--f-display);font-size:calc(30px * var(--display-scale));font-weight:700;line-height:1}
.section-h small{color:var(--muted);font-size:12px;text-align:end}
.list{display:flex;flex-direction:column}
.person{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding-block:10px;border:0;border-bottom:1px solid var(--line);background:none;text-align:start;width:100%}
.person.out{opacity:.45}
.meta{min-width:0}
.meta b{display:block;font-weight:600}
.meta span{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta .badge{display:inline-grid;vertical-align:middle;color:var(--on-signal);font-size:11px;margin-inline-start:6px}
.dist{font-size:13px;color:var(--muted);text-align:end;font-variant-numeric:tabular-nums;display:grid;gap:4px;justify-items:end}
.dist .d{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip{font-size:11px;padding:1px 7px;border-radius:10px;border:1px solid var(--line);white-space:nowrap}
.chip.live{border-color:var(--ok);color:var(--ok)}
.chip.wait{border-color:var(--signal);color:var(--signal)}
.empty{color:var(--muted);text-align:center;padding:28px 12px;font-size:14px;margin:0}

/* groups */
.gicon{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.gicon svg{width:22px;height:22px}
.gicon.cafe{background:#F3E2CF;color:#6B3D16}.gicon.shop{background:#DDE8F5;color:#1F4C7A}
.gicon.building{background:#E2EEDF;color:#2C5A26}.gicon.other{background:var(--signal-soft);color:var(--signal)}
@media (prefers-color-scheme: dark){.gicon.cafe{background:#3A2A1C;color:#F0C79B}.gicon.shop{background:#1C2C3D;color:#A9C8EA}.gicon.building{background:#1E3020;color:#AFD8A7}}
.group{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding-block:12px;border-bottom:1px solid var(--line)}
.group.out{opacity:.5}
.filters{padding-block:6px 2px}

/* banners & buttons */
.banner{margin-top:12px;background:var(--signal-soft);border-radius:14px;padding:12px;display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:center}
.banner p{margin:0;font-size:14px}
.banner .acts{grid-column:1/-1;display:flex;gap:8px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 16px;font-weight:500;min-height:44px}
.btn.sm{padding:5px 12px;font-size:13px;min-height:34px;border-radius:10px}
.btn.primary{background:var(--signal);border-color:var(--signal);color:var(--on-signal)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.btn.ghost{border:0;background:none;color:var(--muted)}
.btn.danger{color:#C23A22;border-color:#E9B4A8}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.full{flex:1}
.card{margin-block:18px 24px;border:1px dashed var(--line);border-radius:14px;padding:12px;display:grid;gap:8px}
.card p{margin:0;font-size:13px;color:var(--muted)}

/* chat */
.chathead{display:flex;align-items:center;gap:10px;padding-block:10px;border-bottom:1px solid var(--line)}
.back{border:0;background:none;font-size:22px;padding:2px 6px;line-height:1;min-width:36px;min-height:36px}
.chathead .meta{flex:1}
.chathead .meta small{color:var(--muted);font-size:12px;display:block}
.msgs{flex:1;overflow-y:auto;padding-block:14px;display:flex;flex-direction:column;gap:6px}
.m{max-width:78%;padding:8px 12px;border-radius:14px;font-size:15px;overflow-wrap:anywhere;white-space:pre-wrap}
.m .who{display:block;font-size:12px;font-weight:600;margin-bottom:1px}
.m.them{align-self:flex-start;background:var(--bg);border-end-start-radius:4px}
.m.mine{align-self:flex-end;background:var(--me);color:var(--on-me);border-end-end-radius:4px}
.m.sys{align-self:center;background:none;color:var(--muted);font-size:12px;padding:2px 8px;text-align:center;max-width:90%}
.m.pic{padding:4px}.m.pic .who{padding:2px 8px 0}
.m img.shot{display:block;width:min(230px,100%);height:auto;border-radius:11px;cursor:zoom-in;background:var(--line);min-height:80px}
.row{display:flex;gap:6px;align-items:flex-end;align-self:flex-start;max-width:85%}
.row .av{width:28px;height:28px}
.row .m{max-width:100%}
.msgs.locked .m:not(.sys),.msgs.locked .row .av{opacity:.4}
.composer{display:flex;gap:8px;align-items:center;padding-block:10px;border-top:1px solid var(--line);padding-bottom:max(10px,env(safe-area-inset-bottom,0px))}
.composer input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:22px;padding:10px 14px;font:inherit;font-size:16px}
.composer .send{border:0;background:var(--signal);color:var(--on-signal);border-radius:22px;padding:10px 16px;font-weight:600;min-height:44px}
.attach{border:1px solid var(--line);background:var(--surface);width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--muted)}
.attach svg{width:20px;height:20px}
.lockline{padding-block:14px;border-top:1px solid var(--line);text-align:center;color:var(--muted);font-size:14px;display:grid;gap:8px;justify-items:center;padding-bottom:max(14px,env(safe-area-inset-bottom,0px))}

/* full screens */
.screen{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:18px;padding-block:24px max(28px,env(safe-area-inset-bottom,0px))}
.screen .toprow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.screen h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:calc(58px * var(--display-scale));line-height:var(--display-lh);text-wrap:balance}
.screen h1 span{color:var(--signal)}
.screen p.lead{margin:0;color:var(--muted);font-size:16px}
.photo-pick{display:flex;align-items:center;gap:14px}
.photo-pick .av{width:72px;height:72px}
.field{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.field input,.field textarea{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:11px 12px;font:inherit;font-size:16px}
.field textarea{resize:vertical;min-height:80px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--signal);flex:none}
.err{color:#C23A22;font-size:13px;margin:0}
.langpick{display:inline-flex;gap:2px;background:var(--bg);border-radius:999px;padding:3px}
.langpick button{border:0;background:none;border-radius:999px;padding:5px 10px;font-size:12px;color:var(--muted)}
.langpick button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(14,42,48,.14)}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(8,14,18,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--surface);width:100%;max-width:480px;border-radius:18px 18px 0 0;padding-block:20px max(20px,env(safe-area-inset-bottom,0px));display:grid;gap:12px;max-height:90%;overflow-y:auto}
.sheet .top{display:flex;gap:14px;align-items:center}
.sheet .top .av{width:64px;height:64px}
.sheet h3{margin:0;font-size:20px}
.sheet h4{margin:6px 0 0;font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.sheet p{margin:0;color:var(--muted)}
.sheet .note{font-size:13px;background:var(--bg);border-radius:10px;padding:10px 12px;color:var(--muted)}
.sheet .acts{display:flex;gap:8px;flex-wrap:wrap}
.sheet hr{border:0;border-top:1px solid var(--line);margin:4px 0;width:100%}
.light{position:fixed;inset:0;background:rgba(5,9,12,.92);display:grid;place-items:center;z-index:25;padding:16px;cursor:zoom-out}
.light img{max-width:100%;max-height:86vh;border-radius:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:20px;font-size:14px;z-index:30;max-width:calc(100% - 32px);text-align:center}
</style>
</head>
<body>
<div id="splash" role="img" aria-label="Niro">
  <div class="inner">
    <svg viewBox="0 0 132 132" aria-hidden="true">
      <circle class="sp-ring" cx="66" cy="66" r="40" fill="none" stroke="#4FD1B5" stroke-width="2"/>
      <circle class="sp-ring r2" cx="66" cy="66" r="40" fill="none" stroke="#4FD1B5" stroke-width="2"/>
      <circle class="sp-ring r3" cx="66" cy="66" r="40" fill="none" stroke="#4FD1B5" stroke-width="2"/>
      <circle cx="66" cy="66" r="30" fill="none" stroke="#2FA88F" stroke-width="7"/>
      <circle class="sp-dot" cx="66" cy="66" r="12.5" fill="#F2553C"/>
      <circle class="sp-sat" cx="97" cy="38" r="8.5" fill="#F7FAF9"/>
    </svg>
    <span class="word" aria-hidden="true">nir<span class="o"></span></span>
  </div>
</div>
<div class="app" id="app"></div>
<div id="layer"></div>
<input type="file" id="picker" accept="image/*" hidden>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="i18n.js"></script>
<script>
"use strict";
/* =================================================================
   Niro · web app v2
   כל הלוגיקה של מי קרוב, מי רואה מה ונעילת שיחות רצה בשרת (schema.sql).
   ================================================================= */
const CFG=window.NIRO_CONFIG||{};
const POLL_MS=4000,PUSH_MS=20000,SPLASH_MIN=1300;
const splashStart=performance.now();

/* ---------- language ---------- */
const LANGS=["he","en","ar","ru"];
let LANG=(()=>{try{const s=localStorage.getItem("niro.lang");if(LANGS.includes(s))return s}catch(e){}
  const n=(navigator.language||"he").slice(0,2).toLowerCase();return LANGS.includes(n)?n:(n==="iw"?"he":"en")})();
function t(k,p){const d=window.NIRO_I18N[LANG]||{},s=(k in d?d[k]:window.NIRO_I18N.he[k])??k;return p?s.replace(/\{(\w+)\}/g,(_,x)=>p[x]??""):s}
function applyLang(){const d=window.NIRO_I18N[LANG];document.documentElement.lang=LANG;document.documentElement.dir=d._dir}
function setLang(l){if(!LANGS.includes(l)||l===LANG)return;LANG=l;try{localStorage.setItem("niro.lang",l)}catch(e){}applyLang();
  const app=$("#app");app.dataset.screen="";render();}
applyLang();

let sb=null;
try{sb=window.supabase.createClient(CFG.url,CFG.key,{auth:{persistSession:true,autoRefreshToken:true}})}catch(e){console.error(e)}

const S={
  screen:"loading",tab:"near",me:null,pos:null,posErr:null,present:false,paused:false,online:true,
  radius:150,visR:150,people:[],chats:[],groups:[],gfilter:"all",
  square:{msgs:[],last:0},priv:{},gmsgs:{},
  open:null,openGroup:null,seen:{square:0,chat:{},group:{}},knownIncoming:new Set(),lastPush:0,lastPushPos:null
};
try{const r=+localStorage.getItem("niro.radius");if([50,100,150,250].includes(r))S.radius=S.visR=r;
  const sn=JSON.parse(localStorage.getItem("niro.seen")||"null");if(sn&&sn.chat)S.seen=sn}catch(e){}
function saveLocal(){try{localStorage.setItem("niro.radius",S.radius);localStorage.setItem("niro.seen",JSON.stringify(S.seen))}catch(e){}}

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const el=(tg,a={},...k)=>{const e=document.createElement(tg);for(const[x,v]of Object.entries(a)){if(x==="class")e.className=v;else if(x==="html")e.innerHTML=v;else if(x.startsWith("on"))e.addEventListener(x.slice(2),v);else if(v!==false&&v!=null)e.setAttribute(x,v)}for(const c of k.flat()){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(c))}return e};

/* ---------- images ---------- */
async function shrink(file,max,square){
  const url=URL.createObjectURL(file),img=new Image();
  await new Promise((r,j)=>{img.onload=r;img.onerror=j;img.src=url});
  let sx=0,sy=0,sw=img.naturalWidth,sh=img.naturalHeight;
  if(square){const m=Math.min(sw,sh);sx=(sw-m)/2;sy=(sh-m)/2;sw=sh=m}
  const k=Math.min(1,max/Math.max(sw,sh)),c=document.createElement("canvas");
  c.width=Math.round(sw*k);c.height=Math.round(sh*k);
  c.getContext("2d").drawImage(img,sx,sy,sw,sh,0,0,c.width,c.height);URL.revokeObjectURL(url);
  return await new Promise(r=>c.toBlob(r,"image/jpeg",.84));
}
async function uploadImage(file,opts){
  const blob=await shrink(file,opts.max,opts.square);
  const path=`${S.me.id}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.jpg`;
  const {error}=await sb.storage.from("photos").upload(path,blob,{contentType:"image/jpeg",upsert:false});
  if(error)throw error;
  return sb.storage.from("photos").getPublicUrl(path).data.publicUrl;
}
function pickImage(opts,cb){

    if(!f.type.startsWith("image/")){toast(t("tOnlyImages"));return}
    toast(t("tUploading"));
    try{cb(await uploadImage(f,opts))}catch(e){console.error(e);toast(t("tUploadFail"))}};
  inp.click();
}

async function boot(){
  if(!sb||!CFG.url||CFG.url.includes("PASTE")){S.screen="config";render();return hideSplash()}
  const {data:{session}}=await sb.auth.getSession();
  if(session){
    const {data}=await sb.from("profiles").select("*").eq("id",session.user.id).maybeSingle();
    if(data){S.me=data;startLocation();S.screen="app";render();hideSplash();loop();return}
  }
  S.screen="onboard";render();hideSplash();
}

/* ---------- location ---------- */
let watchId=null;
function startLocation(){
  if(!("geolocation" in navigator)){S.posErr="unsupported";return}
  if(watchId!=null)return;
  watchId=navigator.geolocation.watchPosition(p=>{
    S.pos={lat:p.coords.latitude,lng:p.coords.longitude,acc:Math.round(p.coords.accuracy)};S.posErr=null;
    pushPresence(false);
  },e=>{S.posErr=e.code===1?"denied":"unavailable";render(true)},{enableHighAccuracy:true,maximumAge:10000,timeout:25000});
}
function movedM(a,b){if(!a||!b)return 1e9;const R=6371000,r=Math.PI/180,dLat=(b.lat-a.lat)*r,dLng=(b.lng-a.lng)*r;
  const h=Math.sin(dLat/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLng/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
let pushing=false;
async function pushPresence(force){
  if(!S.pos||S.paused||pushing)return;
  const now=Date.now();
  if(!force&&now-S.lastPush<PUSH_MS&&movedM(S.lastPushPos,S.pos)<15)return;
  pushing=true;
  try{await rpc("update_presence",{p_lat:S.pos.lat,p_lng:S.pos.lng,p_radius:S.radius});
    const first=!S.present;S.present=true;S.online=true;S.lastPush=now;S.lastPushPos={...S.pos};if(first)poll()}
  catch(e){console.error(e);if(/fetch|network/i.test(e.message||""))S.online=false}
  finally{pushing=false}
}
async function setPaused(p){
  S.paused=p;
  if(p){try{await rpc("go_offline")}catch(e){}S.present=false;S.people=[];S.groups=[];toast(t("tHidden"))}
  else{S.lastPush=0;await pushPresence(true);toast(t("tVisible"))}
  poll();render();
}

/* =================================================================
   Sync loop
   ================================================================= */
let polling=false,tickN=0,loopStarted=false;
function loop(){if(loopStarted)return;loopStarted=true;
  setInterval(()=>{if(document.visibilityState==="visible"){pushPresence(false);poll()}},POLL_MS);
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"){pushPresence(true);poll()}});
  poll();
}
async function poll(){
  if(polling||!S.me)return;polling=true;tickN++;
  try{
    const tasks=[rpc("my_chats")];
    if(S.present&&!S.paused){tasks.push(rpc("nearby_people"),rpc("get_square",{p_after:S.square.last}));
      if(tickN%2===1||S.tab==="groups"||S.tab==="group")tasks.push(rpc("nearby_groups"))}
    const [chats,people,sq,groups]=await Promise.all(tasks);
    S.online=true;
    const prevStatus=Object.fromEntries(S.chats.map(c=>[c.id,c.status]));
    S.chats=chats||[];
    for(const c of S.chats){
      if(c.status==="pending"&&!c.i_requested&&!S.knownIncoming.has(c.id)){S.knownIncoming.add(c.id);toast(t("tWants",{name:c.other_name}));buzz()}
      const was=prevStatus[c.id];
      if(was==="pending"&&c.status==="active"&&c.i_requested)toast(t("tAccepted",{name:c.other_name}));
      if(was==="pending"&&c.status==="declined")toast(t("tDeclined",{name:c.other_name}));
      if(was==="active"&&c.status==="closed"){toast(t("tLocked",{name:c.other_name}));delete S.priv[c.id]}
    }
    if(people)S.people=people;
    if(groups)S.groups=groups;
    if(sq&&sq.length){S.square.msgs.push(...sq.filter(m=>!S.square.msgs.some(x=>x.id===m.id)));S.square.last=sq[sq.length-1].id;
      if(S.square.msgs.length>300)S.square.msgs=S.square.msgs.slice(-300)}
    if(!S.present||S.paused){S.people=[];S.groups=[]}
    if(S.tab==="chat"&&S.open)await fetchPrivate(S.open);
    if(S.tab==="group"&&S.openGroup)await fetchGroup(S.openGroup);
    if(S.tab==="square"){S.seen.square=S.square.last;saveLocal()}
  }catch(e){console.error(e);if(/fetch|network|Failed/i.test(e.message||""))S.online=false}
  finally{polling=false;if(!animating)render(true)}
}
function buzz(){try{if(navigator.userActivation&&navigator.userActivation.hasBeenActive)navigator.vibrate&&navigator.vibrate(60)}catch(e){}}
async function fetchPrivate(id){
  const st=S.priv[id]||(S.priv[id]={msgs:[],last:0});
  const rows=await rpc("get_private",{p_chat:id,p_after:st.last});
  if(rows&&rows.length){st.msgs.push(...rows.filter(m=>!st.msgs.some(x=>x.id===m.id)));st.last=rows[rows.length-1].id}
  const c=S.chats.find(c=>c.id===id);if(c&&c.last_id){S.seen.chat[id]=c.last_id;saveLocal()}
}
async function fetchGroup(id){
  const st=S.gmsgs[id]||(S.gmsgs[id]={msgs:[],last:0});
  const rows=await rpc("get_group",{p_group:id,p_after:st.last});
  if(rows&&rows.length){st.msgs.push(...rows.filter(m=>!st.msgs.some(x=>x.id===m.id)));st.last=rows[rows.length-1].id}
  if(st.last){S.seen.group[id]=st.last;saveLocal()}
}

/* radius: the mint circle grows and shrinks smoothly */
let animating=false,animFrom=0,animStart=0;
function setRadius(r){
  if(r===S.radius)return;
  animFrom=S.visR;S.radius=r;saveLocal();S.square={msgs:[],last:0};S.lastPush=0;
  document.querySelectorAll(".rangebar .seg button").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.r===r?"true":"false"));
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(reduce){S.visR=r;render();}
  else{animStart=performance.now();if(!animating){animating=true;requestAnimationFrame(stepRadar)}}
  pushPresence(true).then(poll);
}
function stepRadar(now){
  const k=Math.min(1,(now-animStart)/650),e=1-Math.pow(1-k,3);
  S.visR=animFrom+(S.radius-animFrom)*e;
  const old=$("#radar");if(old)old.replaceWith(radarSVG());
  if(k<1)requestAnimationFrame(stepRadar);else{animating=false;S.visR=S.radius;render(true)}
}

const near=p=>p.in_range;
function closeness(d){const k=d/S.radius;return t(k<=.34?"veryClose":k<=.67?"close":k<=1?"inRange":"outRange")}
function distTag(d){const k=d/S.radius,n=k<=.34?3:k<=.67?2:k<=1?1:0;
  return el("span",{class:"d",title:closeness(d)},fmt(d),el("span",{class:"bars","aria-hidden":"true"},...[1,2,3].map(i=>el("i",{class:i<=n?"on":""}))))}
function chatWith(uid){return S.chats.find(c=>c.other_id===uid&&c.status!=="declined")}

  const m={active:["cConnected","live"],pending:c.i_requested?["cWaiting","wait"]:["cWants","wait"],declined:["cDeclined",""],closed:["cLocked",""]}[c.status];
  return m?el("span",{class:"chip "+m[1]},t(m[0])):null}

function radarSVG(){
  const NS="http://www.w3.org/2000/svg",s=document.createElementNS(NS,"svg"),away=!S.present||S.paused;
  s.setAttribute("viewBox","0 0 320 320");s.setAttribute("class","radar");s.setAttribute("id","radar");s.setAttribute("role","img");
  s.setAttribute("aria-label",`${t("rangeLabel")}: ${fmt(S.radius)}`);
  // fixed scale: the mint circle really is bigger at 250 m and smaller at 50 m
  const C=160,R=150,vr=S.visR,rIn=44+(vr-50)/200*70;
  const pos=d=>d<=vr?d/vr*rIn:rIn+Math.min((d-vr)/vr,1)*(R-10-rIn);
  const svg=(tg,a,parent=s)=>{const e=document.createElementNS(NS,tg);for(const k in a)e.setAttribute(k,a[k]);parent.append(e);return e};
  const defs=svg("defs",{});
  const grad=svg("radialGradient",{id:"disc",cx:"50%",cy:"50%",r:"50%"},defs);
  [[0,1],[.7,.85],[1,.45]].forEach(([o,op])=>svg("stop",{offset:o,style:`stop-color:var(--ring-soft);stop-opacity:${op}`},grad));
  svg("circle",{cx:C,cy:C,r:R-2,fill:"none",stroke:"var(--line)","stroke-width":1.5,"stroke-dasharray":"0.5 6","stroke-linecap":"round"});
  if(away)svg("circle",{cx:C,cy:C,r:rIn,fill:"none",stroke:"var(--lock)","stroke-width":1.5,"stroke-dasharray":"5 6",opacity:.7});
  else{
    svg("circle",{cx:C,cy:C,r:rIn,fill:"url(#disc)"});
    svg("circle",{cx:C,cy:C,r:rIn*.5,fill:"none",stroke:"var(--ring)","stroke-opacity":.16});
    const phase=-(performance.now()%3600);
    [0,1].forEach(i=>{const c=svg("circle",{class:"pulse",cx:C,cy:C,r:rIn,fill:"none",stroke:"var(--ring)","stroke-width":1.5});c.style.animationDelay=(phase-i*1800)+"ms"});
    svg("circle",{cx:C,cy:C,r:rIn,fill:"none",stroke:"var(--ring)","stroke-width":1.5,"stroke-opacity":.6});
  }
  const label=fmt(Math.round(vr/10)*10),pw=label.length*6.6+20,py=C+rIn;
  svg("rect",{x:C-pw/2,y:py-11,width:pw,height:22,rx:11,fill:"var(--surface)",stroke:away?"var(--line)":"var(--ring)","stroke-opacity":away?1:.5});
  svg("text",{x:C,y:py+4,"text-anchor":"middle","font-size":11.5,"font-weight":600,fill:away?"var(--muted)":"var(--ink)",direction:"ltr"}).textContent=label;
  [...S.people].sort((a,b)=>near(a)-near(b)).forEach(p=>{
    // הכיוון נגזר מהמזהה ולא מהמיקום האמיתי: רואים רק כמה קרוב, לא לאיזה כיוון

  const m2=$("#msgs");if(m2&&(atBottom||!soft)){m2.scrollTop=m2.scrollHeight;m2.querySelectorAll("img.shot").forEach(i=>{if(!i.complete)i.addEventListener("load",()=>{if(m2.scrollHeight-m2.scrollTop-m2.clientHeight<300)m2.scrollTop=m2.scrollHeight},{once:true})})}
  if(soft)main.scrollTop=scroll;
}

render();
boot().catch(e=>{console.error(e);S.screen="onboard";render();hideSplash()});
